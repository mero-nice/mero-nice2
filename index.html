<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=375, height=812, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>هدية ميرو</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 375px;
    height: 812px;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #4b0082);
    color: white;
}

/* قلوب */
.heart {
    position: fixed;
    top: -20px;
    color: rgba(255,0,0,0.6);
    font-size: 20px;
    animation: fall linear infinite;
    z-index: 999;
}

@keyframes fall {
    to {
        transform: translateY(900px);
        opacity: 0;
    }
}

/* صفحة الباسورد */
#loginBox {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: 28px;
    color: gold;
}

input, button {
    width: 80%;
    padding: 12px;
    margin: 10px 0;
    font-size: 18px;
    border-radius: 10px;
    border: none;
}

button {
    background: gold;
    color: #333;
    font-weight: bold;
}

#error {
    color: red;
    display: none;
}

/* زر الذكريات */
#memories {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
}

#memories button {
    padding: 20px 30px;
    font-size: 22px;
    border-radius: 15px;
}

/* المعرض */
#gallery {
    display: none;
    height: 100%;
    width: 100%;
    position: relative;
}

#gallery img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#caption {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    background: rgba(0,0,0,0.6);
    padding: 12px 16px;
    border-radius: 15px;
    max-width: 90%;
    text-align: center;
    color: #ffeb3b;
}

/* صفحة الوداع */
#bye {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
    text-align: center;
}
</style>
</head>

<body>

<!-- موسيقى -->
<audio id="music" src="100.mp3"></audio>

<!-- باسورد -->
<div id="loginBox">
    <h1>🎁 لأحلى ميرو 🎁</h1>
    <input type="password" id="password" placeholder="ادخل كلمة السر">
    <button onclick="checkPassword()">اتفضل</button>
    <div id="error">كلمة السر غلط</div>
</div>

<!-- زر الذكريات -->
<div id="memories">
    <button onclick="showGallery()">ذكرياتنا الحلوة 💛</button>
</div>

<!-- المعرض -->
<div id="gallery">
    <img id="img" onclick="nextPrev(event)">
    <div id="caption"></div>
</div>

<!-- الوداع -->
<div id="bye">
    <div>
        <h1>😂 اي رايك في الاغنيه</h1>
        <p>هو ده اللي فضل من 8 شهور الا 5 ايام حب للأسف الباقي ضاع</p>
    </div>
</div>

<script>
/* القلوب */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random()*3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 150);

/* باسورد */
function checkPassword(){
    if(password.value === "1234"){
        loginBox.style.display = "none";
        memories.style.display = "flex";
        music.play();
    } else {
        error.style.display = "block";
    }
}

/* الصور */
const captions = [
"ده اول استوري اكلمك عشان تبعتيهولي 😅 عشان اكلمك بس ❤️",
"ده بقي استوري حزين بصراحه 🙂 فاخدت القرار اني ابدا انا ❤️",
"", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""
];

let i = 0;

function showGallery(){
    memories.style.display = "none";
    gallery.style.display = "block";
    update();
}

function update(){
    img.src = (i+1) + ".jpeg";
    caption.innerText = captions[i] || "";
}

function nextPrev(e){
    const x = e.offsetX;
    if(x < 187){
        i++;
    } else {
        i--;
    }

    if(i === 27){
        gallery.style.display = "none";
        bye.style.display = "flex";
        return;
    }

    if(i < 0) i = 26;
    update();
}
</script>

</body>
</html>
