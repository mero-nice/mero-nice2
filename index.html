<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية ميرو</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #4b0082);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* صفحة الباسورد */
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 400px;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: gold;
        }

        input, button {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: gold;
            color: #333;
            font-weight: bold;
        }

        /* المعرض - ضبط للموبايل */
        #memories {
            display: none;
            width: 100%;
            height: 100%;
        }

        #gallery {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10;
        }

        #memoryImg {
            width: 100%;
            height: 65vh; /* تقليل الارتفاع لترك مساحة للنص */
            object-fit: contain;
            margin-top: 20px;
        }

        #caption {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-height: 25vh;
            overflow-y: auto;
            font-size: 18px;
            color: #ffeb3b;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            line-height: 1.5;
            direction: rtl;
            box-sizing: border-box;
        }

        /* صفحة الوداع */
        #goodbye {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* القلوب */
        .heart {
            position: absolute;
            width: 15px;
            height: 15px;
            background: red;
            transform: rotate(-45deg);
            top: -20px;
            animation: fall linear;
            z-index: 5;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background: red;
            border-radius: 50%;
        }
        .heart::before { top: -8px; left: 0; }
        .heart::after { top: 0; left: 8px; }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        #showGalleryBtn {
            padding: 20px 40px;
            font-size: 22px;
            background: gold;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            margin-top: 45vh;
        }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h1>🎁 لأحلى ميرو 🎁</h1>
        <input type="password" id="password" placeholder="ادخل كلمة السر">
        <button onclick="checkPassword()">اتفضل</button>
        <div id="error" style="color: #ff4d4d; display: none; margin-top: 10px;">❌ كلمة السر غلط</div>
    </div>

    <div id="memories">
        <button id="showGalleryBtn" onclick="showGallery()">ذكرياتنا الحلوة 💛</button>
        <div id="gallery">
            <img id="memoryImg" src="" alt="صورة" onclick="imageClick(event)">
            <p id="caption"></p>
        </div>
    </div>

    <div id="goodbye">
        <h1>😂 اي رأيك في الأغنية</h1>
        <p>هو ده اللي فضل من 8 شهور الا 5 ايام حب للأسف الباقي ضاع</p>
    </div>

    <audio id="bgMusic" src="100.mp3" loop></audio>

    <script>
        const captions = [
            "ده اول استوري اكلمك عشان تبعتيهولي طبعًا مش عشان مش هاعرف اجيبو .عشان اكلمك بس ❤️ وطبعا انتي كنتي بارده وغلسه 😅 وبعتي الفديو 🎥 وسكتي على كده",
            "ده بقي استوري حزين بصراحه عجبني 🙂 لان بحب عمار برضو نفس القصه 😂 قولتلك ابعتيلي الفديو وبرضو بعتيه وكنتي باره وماتكلمتيش 😒 فاخدت القرار اني ابدا انا ❤️❤️",
            "هنا بقي حسن الحنون اللي كان بيخاف عليكي وعلي تعبك",
            "هنا بقي منار اللي كانت بتحبني",
            "هنا بقي لما كنتي بتحبي تكلميني",
            "ودي بقي منار لما تتعصب كانت كيوت قوي والله",
            "لما يندمج الحب والعصبيه في وقت واحد",
            "ودي بقي لما كانت الحب بتحاول تخليني اقول كلمه حلوه",
            "في الموقف ده بقي كنا المفروض هانقفل بس كل ماقول سلام تقولي حاجه وكل متقولي سلام انا اقول حاجه",
            "😍الرسالة دي في قلبي والله😍",
            "دي كمالة الموقف اللي فات",
            "هنا بقي لما كنت افتح الشات الاقي رسالة حلوه كده نكمل بيها باقي اليوم 😂❤️",
            "لما كان فيه وحده اسمها منار بتخاف عليا",
            "مش عارف جبتها ليه بس عجبتني 🤣❤️",
            "دي بقي عشان انا بقول فيها كلام حلو ورايق",
            "دي بقي البت منار لما كانت بتخاف علي زعلي وده دليل انك كنتي مستفزه 😂❤️😍",
            "دي بقي منار اللي كانت بتاكل بعقلي حلاوه",
            "دي بقي قلبي لما كانت بتتقمص 😂❤️❤️❤️😘",
            "دي بقي جبتها عشان كان الموقف بيتكرر كتير بس",
            "هنا لما كنتي بتقلديني وخلاص",
            "ده بقي كان وداع المحبين اللي الدنيا جت عليهم 😂❤️",
            "ده لما كنتي بتقولي بتحبيني",
            "هنا بقي بدأت مسرحية المشاكل والنكد",
            "هنا كان فيه حوار بس اي بقي مش قادر افتكر",
            "دي بقي لما كنتي بتشكي فيا وفي اخلاقي",
            "هنا بقي ربنا براني منك وعرفك اني اطهر انسان ع الكوكب",
            "دي بقي الصوره الوحيدة اللي لقيتها للأسف"
        ];

        let currentIndex = 0;

        function checkPassword() {
            const correctPassword = "1234";
            const input = document.getElementById("password").value;
            if(input === correctPassword){
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("memories").style.display = "block";
                document.getElementById("bgMusic").play();
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        function showGallery() {
            document.getElementById("showGalleryBtn").style.display = "none";
            document.getElementById("gallery").style.display = "block";
            updateImage();
        }

        function updateImage() {
            const img = document.getElementById("memoryImg");
            img.src = (currentIndex + 1) + ".jpeg";
            document.getElementById("caption").textContent = captions[currentIndex];
        }

        function imageClick(event) {
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX - rect.left;
            
            // اليمين ينقل للي بعده (أسهل للموبايل)
            if(x > rect.width / 2){
                currentIndex++;
                if(currentIndex >= captions.length) {
                    document.getElementById("gallery").style.display = "none";
                    document.getElementById("goodbye").style.display = "flex";
                    return;
                }
            } else {
                currentIndex--;
                if(currentIndex < 0) currentIndex = 0;
            }
            updateImage();
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (2 + Math.random() * 3) + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(createHeart, 200);
    </script>
</body>
</html>
