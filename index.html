<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>هدية ميرو</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #4b0082);
    color:white;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    width: 100vw;
    height: 100vh;
    max-width: 450px;   /* عرض ثابت */
    max-height: 800px;  /* ارتفاع ثابت */
    overflow:hidden;
    position: relative;
}

/* صفحة الباسورد */
.login-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding:30px 40px;
    border-radius:20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    width: 90%;
    text-align:center;
}

.login-box h1 {
    font-size: 28px;
    margin-bottom:20px;
    color: gold;
    text-shadow: 2px 2px 8px #000;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button {
    cursor:pointer;
    background: gold;
    color:#333;
    font-weight:bold;
    transition:0.3s;
}

button:hover {
    background:#ffeb3b;
    transform: scale(1.05);
}

#error {
    color:#ff4d4d;
    margin-top:10px;
    display:none;
}

/* زر ذكرياتنا الحلوة */
#memories {
    display:none;
    text-align:center;
    margin-top:20px;
}

#memories button {
    padding: 15px 40px;
    font-size: 20px;
    border-radius: 15px;
    background: #ffeb3b;
    color:#333;
    font-weight:bold;
    border:none;
    cursor:pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition:0.3s;
}

#memories button:hover {
    transform: scale(1.05);
    background: gold;
}

/* المعرض */
#gallery {
    display:none;
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    z-index:1;
}

#gallery img {
    width: 100%;
    height: 80%;       
    object-fit: contain;  
    cursor: pointer;
    user-select: none;
}

#caption {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: #ffeb3b;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 90%;
    word-wrap: break-word;
    white-space: normal;
}

/* صفحة وداع */
#goodbye {
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100%;
    color:white;
    text-align:center;
}

/* القلوب المتساقطة */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(-45deg);
    top: -20px;
    animation: fall linear;
    z-index:2;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
}

.heart::before {
    top: -10px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 10px;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(360deg);
    }
}
</style>
</head>
<body>

<!-- صفحة الباسورد -->
<div class="login-box" id="loginBox">
    <h1>🎁 لأحلى ميرو 🎁</h1>
    <input type="password" id="password" placeholder="ادخل كلمة السر">
    <button onclick="checkPassword()">اتفضل</button>
    <div id="error">❌ كلمة السر غلط</div>
</div>

<!-- زر ذكرياتنا الحلوة -->
<div id="memories">
    <button id="showGalleryBtn" onclick="showGallery()">ذكرياتنا الحلوة 💛</button>
    <div id="gallery">
        <img id="memoryImg" src="" alt="صورة" onclick="imageClick(event)">
        <p id="caption"></p>
    </div>
</div>

<!-- صفحة الوداع -->
<div id="goodbye">
    <h1>😂 اي رأيك في الأغنية</h1>
    <p>هو ده اللي فضل من 8 شهور الا 5 ايام حب للأسف الباقي ضاع</p>
</div>

<!-- عنصر الصوت -->
<audio id="bgMusic" src="100.mp3"></audio>

<script>
// التحقق من الباسورد وتشغيل الأغنية مباشرة عند الضغط
function checkPassword() {
    const correctPassword = "1234"; // غير الباسورد هنا
    const input = document.getElementById("password").value;
    if(input === correctPassword){
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("memories").style.display = "block";
        const music = document.getElementById("bgMusic");
        music.play();
    } else {
        document.getElementById("error").style.display = "block";
    }
}

// نصوص لكل صورة من 1.jpeg إلى 27.jpeg
const captions = [
    "ده اول استوري اكلمك عشان تبعتيهولي طبعًا مش عشان مش هاعرف اجيبو .عشان اكلمك بس ❤️ وطبعا انتي كنتي بارده وغلسه 😅 وبعتي الفديو 🎥 وسكتي على كده",
    "ده بقي استوري حزين بصراحه عجبني 🙂 لان بحب عمار برضو نفس القصه 😂 قولتلك ابعتيلي الفديو وبرضو بعتيه وكنتي باره وماتكلمتيش 😒 فاخدت القرار اني ابدا انا ❤️❤️",
    "هنا بقي حسن الحنون اللي كان بيخاف عليكي وعلي تعبك",
    "هنا بقي منار اللي كانت بتحبني",
    "هنا بقي لما كنتي بتحبي تكلميني",
    "ودي بقي منار لما تتعصب كانت كيوت قوي والله",
    "لما يندمج الحب والعصبيه في وقت واحد",
    "ودي بقي لما كانت الحب بتحاول تخليني اقول كلمه حلوه",
    "في الموقف ده بقي كنا المفروض هانقفل بس كل ماقول سلام تقولي حاجه وكل متقولي سلام انا اقول حاجه",
    "😍الرساله دي في قلبي والله😍",
    "دي كماله الموقف اللي فات",
    "هنا بقي لما كنت افتح الشات الاقي رساله حلوه كده نكمل بيها باقي اليوم 😂❤️",
    "لما كان فيه وحده اسمها منار بتخاف عليا",
    "مش عارف جبتها ليه بس عجبتني 🤣❤️",
    "دي بقي عشان انا بقول فيها كلام حلو ورايق",
    "دي بقي البت منار لما كانت بتخاف علي زعلي وده دليل انك كنتي مستفزه 😂❤️😍",
    "دي بقي منار اللي كانت بتاكل بعقلي حلاوه",
    "دي بقي قلبي لما كانت بتتقمص 😂❤️❤️❤️😘",
    "دي بقي جبتها عشان كان الموقف بيتكرر كتير بس",
    "هنا لما كنتي بتقلديني وخلاص",
    "ده بقي كان وداع المحبين اللي الدنيا جت عليهم 😂❤️",
    "ده لما كنتي بتقولي بتحبيني",
    "هنا بقي بدات مصرحيه المشاكل والنكد",
    "هنا كان فيه حوار بس اي بقي مش قادر افتكر",
    "دي بقي لما كنتي بتشكي فيا وفي اخلاقي",
    "هنا بقي ربنا براني منك وعرفك اني اطهر انسان ع الكوكب",
    "دي بقي الصوره الوحيده اللي لقيتها للاسف"
];

let currentIndex = 0;

// عرض المعرض
function showGallery() {
    document.getElementById("showGalleryBtn").style.display = "none";
    document.getElementById("gallery").style.display = "block";
    updateImage();
}

// تحديث الصورة والنص
function updateImage() {
    const img = document.getElementById("memoryImg");
    img.src = (currentIndex+1) + ".jpeg";
    document.getElementById("caption").textContent = captions[currentIndex];
}

// الضغط على الصورة: نصف يسار → التالي، نصف يمين → السابق
function imageClick(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    
    if(x < rect.width/2){
        currentIndex++;
        if(currentIndex >= captions.length) {
            document.getElementById("gallery").style.display = "none";
            document.getElementById("goodbye").style.display = "flex";
            return;
        }
    } else {
        currentIndex--;
        if(currentIndex < 0) currentIndex = captions.length - 1;
    }
    updateImage();
}

// إنشاء قلوب متساقطة على كل الصفحة
function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 3 + Math.random() * 2 + "s";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 5000);
}

// القلوب تبدأ من أول الصفحة وتستمر
setInterval(createHeart, 150); 
</script>

</body>
</html>
