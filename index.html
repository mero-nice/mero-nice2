<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هدية ميرو</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 320px;  /* صغّرت شويه */
    height: 568px; /* صغّرت شويه */
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #4b0082);
    color: white;
}

/* قلوب */
.heart {
    position: fixed;
    top: -20px;
    color: rgba(255,0,0,0.6);
    font-size: 16px;
    animation: fall linear infinite;
    z-index: 999;
}

@keyframes fall {
    to {
        transform: translateY(600px);
        opacity: 0;
    }
}

/* صفحة الباسورد */
#loginBox {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: 24px;
    color: gold;
}

input, button {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}

button {
    background: gold;
    color: #333;
    font-weight: bold;
}

#error {
    color: red;
    display: none;
}

/* زر الذكريات */
#memories {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
}

#memories button {
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 12px;
}

/* المعرض */
#gallery {
    display: none;
    height: 100%;
    width: 100%;
    position: relative;
}

#gallery img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#caption {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    background: rgba(0,0,0,0.6);
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 90%;
    text-align: center;
    color: #ffeb3b;
}

/* صفحة الوداع */
#bye {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
    text-align: center;
}
</style>
</head>

<body>

<!-- موسيقى -->
<audio id="music" src="100.mp3"></audio>

<!-- باسورد -->
<div id="loginBox">
    <h1>🎁 لأحلى ميرو 🎁</h1>
    <input type="password" id="password" placeholder="ادخل كلمة السر">
    <button onclick="checkPassword()">اتفضل</button>
    <div id="error">كلمة السر غلط</div>
</div>

<!-- زر الذكريات -->
<div id="memories">
    <button onclick="showGallery()">ذكرياتنا الحلوة 💛</button>
</div>

<!-- المعرض -->
<div id="gallery">
    <img id="img" onclick="nextPrev(event)">
    <div id="caption"></div>
</div>

<!-- الوداع -->
<div id="bye">
    <div>
        <h1>😂 اي رايك في الاغنيه</h1>
        <p>هو ده اللي فضل من 8 شهور الا 5 ايام حب للأسف الباقي ضاع</p>
    </div>
</div>

<script>
/* القلوب */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random()*3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 150);

/* باسورد */
const password = document.getElementById("password");
const loginBox = document.getElementById("loginBox");
const memories = document.getElementById("memories");
const error = document.getElementById("error");
const music = document.getElementById("music");

function checkPassword(){
    if(password.value === "1234"){
        loginBox.style.display = "none";
        memories.style.display = "flex";
        music.play();
    } else {
        error.style.display = "block";
    }
}

/* الصور */
const captions = [
    "ده اول استوري اكلمك عشان تبعتيهولي طبعًا مش عشان مش هاعرف اجيبو .عشان اكلمك بس وطبعا انتي كنتي بارده وغلسه وبعتي الفديو وسكتي على كده",
    "ده بقي استوري حزين بصراحه عجبني  لان بحب عمار برضو نفس القصه قولتلك ابعتيلي الفديو وبرضو بعتيه وكنتي باره وماتكلمتيش فاخدت القرار اني ابدا انا",
    "هنا بقي حسن الحنون اللي كان بيخاف عليكي وعلي تعبك",
    "هنا بقي منار اللي كانت بتحبني",
    "هنا بقي لما كنتي بتحبي تكلميني",
    "ودي بقي منار لما تتعصب كانت كيوت قوي والله",
    "لما يندمج الحب والعصبيه في وقت واحد",
    "ودي بقي لما كانت الحب بتحاول تخليني اقول كلمه حلوه",
    "في الموقف ده بقي كنا المفروض هانقفل بس كل ماقول سلام تقولي حاجه وكل متقولي سلام انا اقول حاجه",
    "😍الرساله دي في قلبي والله😍",
    "دي كماله الموقف اللي فات",
    "هنا بقي لما كنت افتح الشات الاقي رساله حلوه كده نكمل بيها باقي اليوم 😂❤️",
    "لما كان فيه وحده اسمها منار بتخاف عليا",
    "مش عارف جبتها ليه بس عجبتني 🤣❤️",
    "دي بقي عشان انا بقول فيها كلام حلو ورايق",
    "دي بقي البت منار لما كانت بتخاف علي زعلي وده دليل انك كنتي مستفزه 😂❤️😍",
    "دي بقي منار اللي كانت بتاكل بعقلي حلاوه",
    "دي بقي قلبي لما كانت بتتقمص 😂❤️❤️❤️😘",
    "دي بقي جبتها عشان كان الموقف بيتكرر كتير بس",
    "هنا لما كنتي بتقلديني وخلاص",
    "ده بقي كان وداع المحبين اللي الدنيا جت عليهم 😂❤️",
    "ده لما كنتي بتقولي بتحبيني",
    "هنا بقي بدات مصرحيه المشاكل والنكد",
    "هنا كان فيه حوار بس اي بقي مش قادر افتكر",
    "دي بقي لما كنتي بتشكي فيا وفي اخلاقي",
    "هنا بقي ربنا براني منك وعرفك اني اطهر انسان ع الكوكب",
    "دي بقي الصوره الوحيده اللي لقيتها للاسف"
];

let i = 0;
const img = document.getElementById("img");
const caption = document.getElementById("caption");
const gallery = document.getElementById("gallery");
const bye = document.getElementById("bye");

function showGallery(){
    memories.style.display = "none";
    gallery.style.display = "block";
    update();
}

function update(){
    img.src = (i+1) + ".jpeg";
    caption.innerText = captions[i] || "";
}

function nextPrev(e){
    const x = e.offsetX;
    if(x < 160){ // الجهة اليسرى
        i--;
    } else { // الجهة اليمنى
        i++;
    }

    if(i >= captions.length){
        gallery.style.display = "none";
        bye.style.display = "flex";
        return;
    }

    if(i < 0) i = captions.length - 1;
    update();
}
</script>

</body>
</html>
